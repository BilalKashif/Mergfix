[package]
name = "mergefix"
version = "0.1.0"
edition = "2024"
description = "A tiny, fast GUI for resolving Git merge conflicts in huge files"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
memchr = "2.8"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
